name: Stockora CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-audit:
    name: Lint & Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Run ESLint Checks
        run: npm run lint

      - name: Run Audit Checks
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.63.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  format-and-typecheck:
    name: Formatting & Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Verify TypeScript compilation
        run: npm run type-check

  unit-and-integration-test:
    name: Unit & Integration Testing
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379

    env:
      PORT: 5000
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/stockora-ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-dummy-jwt-secret-do-not-use-in-production
      JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-do-not-use-in-production
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Run Vitest Suite
        run: npm run test

  build-and-archive:
    name: Compile & Package Application
    runs-on: ubuntu-latest
    needs: [lint-and-audit, format-and-typecheck, unit-and-integration-test]
    env:
      PORT: 5000
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/stockora-ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-dummy-jwt-secret-do-not-use-in-production
      JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-do-not-use-in-production
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Compile and Build Stack
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: stockora-build-package
          path: dist/
          retention-days: 7
